<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
        <link rel="stylesheet" href="assets/css/launcher.css">
    </head>
    <body>
        <div class="app-titlebar">
            <div class="app-titlebar-brand">
                <div class="app-titlebar-logo"><img src="assets/images/brand/logo-mark.png" alt="MetalDaze" class="app-titlebar-logo-img"></div>
                <span class="app-titlebar-name" data-i18n="titlebar.name">MetalDaze Launcher</span>
                <span class="app-titlebar-badge" data-i18n="titlebar.badge">EN DESARROLLO</span>
            </div>

            <div class="frame darwin-frame">
                <div id="mac-close" class="button-frame darwin-icon-close"></div>
                <div id="mac-minimize" class="button-frame darwin-icon-minimize"></div>
                <div id="mac-maximize" class="button-frame darwin-icon-maximize"></div>
            </div>

            <div class="frame win-frame">
                <div id="win-minimize" class="button-frame icon-minimize"></div>
                <div id="win-maximize" class="button-frame icon-maximize"></div>
                <div id="win-close" class="button-frame icon-close"></div>
            </div>
        </div>

        <div class="popup">
            <div class="popup-tab">
                <div class="popup-title"></div>
                <div class="popup-content"></div>
                <div class="popup-options">
                    <button class="popup-button" data-i18n="popup.ok">OK</button>
                </div>
            </div>
        </div>
        <div class="panels"></div>
        <script src="assets/js/launcher.js" type="module"></script>
    </body>
</html>
