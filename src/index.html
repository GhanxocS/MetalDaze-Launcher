<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
        <link rel="stylesheet" href="assets/css/index.css">
    </head>
    <body>
        <div id="splash" class="is-hidden">
            <div class="splash-frame">
                <div class="splash-top-bar">
                    <div class="splash-top-logo"><img src="assets/images/brand/logo-mark.png" alt="MetalDaze" class="splash-top-logo-img"></div>
                    <span class="splash-top-name">MetalDaze Launcher</span>
                </div>
                <div class="splash-content">
                    <div class="splash-logo-wrap">
                        <img class="splash" src="assets/images/brand/logo-mark.png" />
                    </div>
                    <p class="splash-message"></p>
                    <p class="splash-author"><span class="author"></span></p>
                    <p class="message">Buscando actualizaciones...</p>
                    <progress value="0" max="0" class="progress"></progress>
                </div>
                <div class="splash-bottom-bar">
                    <div class="splash-studio">MetalDaze Estudio</div>
                </div>
            </div>
        </div>
        <script src="assets/js/index.js" type="module"></script>
    </body>
</html>
